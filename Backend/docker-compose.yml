version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aqualora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqualora
      POSTGRES_USER: aqualora
      POSTGRES_PASSWORD: aqualora123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
