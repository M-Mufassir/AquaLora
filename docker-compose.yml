services:
  postgres:
    image: postgres:16-alpine
    container_name: aqualora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqualora}
      POSTGRES_USER: ${POSTGRES_USER:-aqualora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqualora123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqualora} -d ${POSTGRES_DB:-aqualora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqualora-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aqualora:aqualora123@postgres:5432/aqualora}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123}
      JWT_SECRET: ${JWT_SECRET:-aqualora-super-secret-jwt-key}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
